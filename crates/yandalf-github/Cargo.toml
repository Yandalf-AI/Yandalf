[package]
name = "yandalf-github"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
git-worktree = ["dep:yandalf-git-worktree"]

[dependencies]
yandalf-core.workspace = true
yandalf-channels.workspace = true
yandalf-git-worktree = { workspace = true, optional = true }
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "sync", "time", "rt", "macros"] }
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
yandalf-sqlite.workspace = true
tempfile.workspace = true
